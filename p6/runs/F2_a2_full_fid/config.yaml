run_name: F2_a2_full_fid
seed: 0
model:
  phase1_ckpt: runs/A2_encdec_clean_1B/best.pt
  src_len: 1024
  tgt_len: 768
  dropout: 0.1
  n_chunks: 4
data:
  strategy: salient
  head_frac: 0.15
peft:
  method: full
train:
  epochs: 4
  lr: 0.0001
  micro_batch: 4
  grad_accum: 4
  warmup: 100
  weight_decay: 0.01
  label_smoothing: 0.0
  eval_batch: 8
gen:
  max_new_tokens: 800
  min_new_tokens: 300
  no_repeat_ngram: 4
  repetition_penalty: 1.0
  temperature: 0
  batch_size: 32
  val_docs: 300
