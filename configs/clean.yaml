# Cleaned 1B-token corpus (slides/data_audit_retrain.tex, methods M1-M7 and M10).
# Stack on top of an architecture config:
#   python scripts/01_prepare_data.py --config configs/base.yaml configs/clean.yaml
#   python scripts/04_train.py --config configs/a4_efficient.yaml configs/clean.yaml --set run_name=A4_efficient_clean
# Same tokenizer (data/tokenizer/legal_bpe.json), schedule and mixing ratios as the first run.
paths:
  data_dir: data_clean
data:
  train_tokens: 1_000_000_000    # pool for R1 (200M tokens seen) and R2 (1B tokens seen)
  val_tokens: 5_000_000
  cleaning:
    workers: 24
    max_records: null            # per source; smoke tests only
    rtf_min_hits: 3              # M4: strip RTF control words when a doc has at least this many
    max_stutter_ratio: 0.02      # M3: drop docs where stutter repair removed more than 2% of words
    min_letter_ratio: 0.6        # M5: letters / characters
    min_words:                   # M5: per-source minimum length (after cleaning)
      default: 50
      high_courts: 100
    short_words: 200             # M5: a "short order" has fewer words than this
    short_max_share:             # M5: cap on the token share of short docs within a source
      high_courts: 0.25
    shingle_words: 5             # M1: word 5-grams for MinHash
    minhash_perms: 128
    lsh_bands: 16                # 16 bands x 8 rows: candidates from Jaccard ~0.7
    near_dup_threshold: 0.8      # verified signature agreement to call two docs duplicates
    tpw_sample_docs: 2000        # M6: docs per source used to measure tokens/word
    leak_ngram: 13               # M2: val-vs-train overlap on word 13-grams
    leak_keep_mod: 8             # keep 1 in 8 13-grams (the same ones in every doc)
    leak_max_overlap: 0.5        # drop a val doc if more than half its 13-grams are in train
    leak_reference:              # also keep val clear of the FIRST corpus, so R0 is scored fairly
      - data/corpus/train.jsonl
    contamination_check:         # report only
      phase1_test: data/test/test.json
      phase2_test: data/hf/Phase_2_LNER/Test/fold3-text.json
