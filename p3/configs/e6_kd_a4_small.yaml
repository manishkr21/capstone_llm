inherit: base.yaml
run_name: E6_kd_a4_small
model:
  phase1_ckpt: runs/A4_efficient_clean_1B/best.pt
  attention: bidirectional
  keep_layers: [0, 2, 4, 5, 6, 8]   # 6 of 10 blocks, keeps all three global layers (2, 5, 8)
peft:
  method: full
train:
  lr: 1.0e-4
distill:
  teacher_run: runs/E1_a4_lorma     # fold k student learns from fold k teacher (same training docs)
  alpha: 0.5
  temperature: 2.0
