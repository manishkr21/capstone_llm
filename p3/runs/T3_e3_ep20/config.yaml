run_name: T3_e3_ep20
seed: 1337
runs_dir: runs
data:
  dir: ../capstone_llm/data/hf/Phase_3_RR
  context: window
  max_sent_tokens: 128
cv:
  n_folds: 5
  seed: 0
model:
  phase1_ckpt: runs/A3_prefixlm_clean_1B/best.pt
  attention: causal
  encdec_output: decoder
  keep_layers: null
  doc_layer: bilstm
  hidden: 256
  pos_buckets: 20
  crf: true
  dropout: 0.1
peft:
  method: rslora
  r: 64
  alpha: 16
  lora_dropout: 0.05
  targets:
  - q
  - k
  - v
  - o
  - fc
  - proj
train:
  window: 512
  chunk_sents: 128
  chunks_per_step: 4
  max_windows: 16
  epochs: 20
  patience: 6
  lr: 0.001
  head_lr: 0.001
  weight_decay: 0.01
  warmup_frac: 0.1
  grad_clip: 1.0
  logit_adjust_tau: 1.0
infer:
  window: 512
  max_windows: 32
distill: null
