run_name: E5_a4_qlora
seed: 1337
runs_dir: runs
data:
  dir: ../capstone_llm/data/hf/Phase_3_RR
  context: window
  max_sent_tokens: 128
cv:
  n_folds: 5
  seed: 0
model:
  phase1_ckpt: runs/A4_efficient_clean_1B/best.pt
  attention: bidirectional
  encdec_output: decoder
  keep_layers: null
  doc_layer: bilstm
  hidden: 256
  pos_buckets: 20
  crf: true
  dropout: 0.1
peft:
  method: qlora
  r: 16
  alpha: 32
  lora_dropout: 0.05
  block: 64
  targets:
  - q
  - k
  - v
  - o
  - gate
  - up
  - proj
train:
  window: 512
  chunk_sents: 128
  chunks_per_step: 4
  max_windows: 16
  epochs: 12
  patience: 4
  lr: 0.001
  head_lr: 0.001
  weight_decay: 0.01
  warmup_frac: 0.1
  grad_clip: 1.0
  logit_adjust_tau: 1.0
infer:
  window: 512
  max_windows: 32
distill: null
