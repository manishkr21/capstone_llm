run_name: E5_a1_adalora
seed: 1337
runs_dir: runs
data:
  strategy: last
  n_chunks: 8
  chunk_len: 512
model:
  phase1_ckpt: runs/A1_gpt_clean_1B/best.pt
  attention: causal
  encdec_output: decoder
  keep_layers: null
  doc_layer: gru_attn
  hidden: 256
  dropout: 0.1
  max_chunks: 64
peft:
  method: adalora
  r: 12
  target_r: 8
  alpha: 32
  lora_dropout: 0.05
  targets:
  - q
  - k
  - v
  - o
  - fc
  - proj
  orth_reg: 0.1
train:
  epochs: 2
  docs_per_step: 16
  docs_per_micro: 4
  max_chunks: 32
  lr: 0.0002
  head_lr: 0.001
  weight_decay: 0.01
  warmup_frac: 0.06
  grad_clip: 1.0
  class_weight: true
  eval_every: 250
  log_every: 50
distill: null
