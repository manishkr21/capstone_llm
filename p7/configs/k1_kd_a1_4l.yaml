# Knowledge distillation: A1 student with 4 of its 8 blocks (Phase-1 weights of blocks 0, 2, 5, 7), fully
# fine-tuned on gold relevance + the batch score distribution of the E2 A1 full teacher.
inherit: base.yaml
run_name: K1_kd_a1_4l
model: {phase1_ckpt: runs/A1_gpt_clean_1B/best.pt, attention: bidirectional, keep_layers: [0, 2, 5, 7]}
peft: {method: full}
train: {lr: 5.0e-5}
distill: {teacher: E2_a1_full, alpha: 0.5, temperature: 2.0}
