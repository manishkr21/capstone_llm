# Cross-encoder reranker (cross_train.py): A1, fully fine-tuned, bidirectional over [window + case chunk].
inherit: base.yaml
run_name: C1_a1_cross
stack: STK4_rc_blend4     # base ranking whose top-30 is re-ordered (cross_prep.py lists)
model: {phase1_ckpt: runs/A1_gpt_clean_1B/best.pt, attention: bidirectional, dim: 1}
peft: {method: full}
train: {epochs: 2, queries: 4, n_neg: 11, win_len: 192, lr: 3.0e-5, max_tokens: 32768, eval_every: 100, log_every: 20}
