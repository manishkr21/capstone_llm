run_name: E2d_a1_full_hard
seed: 3
model:
  phase1_ckpt: runs/A1_gpt_clean_1B/best.pt
  attention: bidirectional
  encdec_output: decoder
  keep_layers: null
  chunk_pool: mean
  dim: 256
  chunk_agg: max
  win_agg: lse
  win_temp: 0.05
peft:
  method: full
train:
  epochs: 4
  queries: 4
  n_pos: 2
  n_hard: 6
  hard_pool: 50
  max_wins: 12
  chunk_len: 512
  train_chunks: 6
  eval_chunks: 32
  max_tokens: 32768
  tau: 0.05
  lr: 3.0e-05
  weight_decay: 0.01
  warmup_frac: 0.05
  grad_clip: 1.0
  log_every: 20
distill: null
