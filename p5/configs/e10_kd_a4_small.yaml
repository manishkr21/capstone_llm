# Knowledge distillation: A4 student with 6 of its 10 blocks (keeps global layers 2, 5, 8), fully fine-tuned on
# gold labels + the softened statute logits of an ensemble teacher (E5 A4 partial + E3 A3 adapters + E2 A1 full, dump_logits.py)
inherit: base.yaml
run_name: E10_kd_a4_small
model: {phase1_ckpt: runs/A4_efficient_clean_1B/best.pt, keep_layers: [0, 2, 4, 5, 6, 8]}
peft: {method: full}
train: {lr: 5.0e-5}
distill: {teacher_logits: runs/TEACHER_ens/train_logits.npy, alpha: 0.5, temperature: 2.0}
