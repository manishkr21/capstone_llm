run_name: A3_prefixlm
seed: 1337
paths:
  data_dir: data
  runs_dir: runs
data:
  local_dir: data/hf
  json_path: null
  text_field: null
  sources:
    acts: 0.1
    supreme_court: 0.3
    high_courts: 0.35
    tribunals: 0.25
  train_tokens: 200000000
  val_tokens: 5000000
  tokens_per_word_estimate: 1.35
  val_fraction: 0.01
  doc_keep_prob: 0.5
  min_words: 50
  collapse_whitespace: true
  n_dev_prompts: 200
  prompt_words: 512
