  n_heads: 12
  d_ff: 3072
  causal_prob: 0.5
  dropout: 0.0
train:
  block_size: 1024
  micro_batch_size: 8
  grad_accum_steps: 8
  max_steps: 3000
  lr: 0.0006
  min_lr: 6.0e-05
