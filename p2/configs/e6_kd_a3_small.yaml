# E6 - Knowledge distillation. Teacher: E1 (A3, 8 layers, fully fine-tuned for L-NER).
# Student: A3 with 4 of the 8 Phase-1 blocks (every other one), fully fine-tuned with
# loss = alpha * CE(gold tags) + (1 - alpha) * T^2 * KL(teacher || student).
inherit: base.yaml
run_name: E6_kd_a3_small
model:
  phase1_ckpt: runs/A3_prefixlm/best.pt
  keep_layers: [1, 3, 5, 7]
peft:
  method: full
train:
  lr: 2.0e-4
distill:
  teacher_run: runs/E1_a3_full
  alpha: 0.5
  temperature: 2.0
