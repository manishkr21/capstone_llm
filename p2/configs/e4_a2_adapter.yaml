# E4 - A2 encoder-decoder + Houlsby bottleneck adapters (after attention and MLP of every block).
# BART-style tagging: the encoder reads the window, the decoder re-reads it while cross-attending
# to the encoder, and the decoder states are tagged. (The A2 encoder output alone is nearly
# collapsed - mean token cosine 0.92 - and reached only 0.11 dev macro-F1, see README.)
inherit: base.yaml
run_name: E4_a2_adapter
model:
  phase1_ckpt: runs/A2_encdec/best.pt
  encdec_output: decoder
peft:
  method: adapter
  bottleneck: 64
train:
  lr: 1.0e-3
