# E2 - A4 efficient decoder + LoRMA+ (multiplicative low-rank update) on attention and MLP.
inherit: base.yaml
run_name: E2_a4_lorma
model:
  phase1_ckpt: runs/A4_efficient/best.pt
  attention: bidirectional
peft:
  method: lorma
  r: 16
  alpha: 32
  lora_dropout: 0.05
  targets: [q, k, v, o, gate, up, proj]
train:
  lr: 1.0e-3
